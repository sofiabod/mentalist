[project]
name = "sfx"
version = "0.0.0"
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest==9.1.1"]
eval = ["harbor==0.22.0", "requests==2.32.5"]
mini-swe = ["mini-swe-agent==2.4.6", "PyYAML==6.0.3"]
mining = ["pandas==3.0.2", "huggingface-hub==1.11.0", "pyarrow==24.0.0"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
